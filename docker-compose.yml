services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ARVI_DB_PATH: /data/arvi_bot.db
    ports:
      - "8501:8501"
    volumes:
      - arvi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  index-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "bot_worker.py"]
    env_file: .env
    environment:
      ARVI_DB_PATH: /data/arvi_bot.db
      ARVI_BOT_CONFIG: /app/bot_config.example.json
      ARVI_LIVE_TRADING: "NO"
    volumes:
      - arvi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "worker_healthcheck.py", "INDEX_OPTIONS"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  stock-fno-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "stock_fno_worker.py"]
    env_file: .env
    environment:
      ARVI_DB_PATH: /data/arvi_bot.db
    volumes:
      - arvi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  arvi-data:
