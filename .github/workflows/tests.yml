name: AI ARVI ALGO checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py engine.py kite_adapter.py stock_selector.py market_briefing.py option_enrichment.py bot_ledger.py order_executor.py bot_worker.py stock_fno_worker.py worker_healthcheck.py startup_reconciliation.py tests
      - run: pytest -q
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
